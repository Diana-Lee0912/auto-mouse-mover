<svg xmlns="http://www.w3.org/2000/svg" width="767" height="780" viewBox="0 0 767 780">
<rect width="767" height="780" rx="10" fill="#282c34"/>
<rect width="767" height="34" rx="10" fill="#21252b"/><rect y="24" width="767" height="10" fill="#21252b"/>
<circle cx="20" cy="17" r="6" fill="#ff5f56"/><circle cx="40" cy="17" r="6" fill="#ffbd2e"/><circle cx="60" cy="17" r="6" fill="#27c93f"/>
<text x="383.5" y="22" text-anchor="middle" font-family="-apple-system, Segoe UI, Helvetica, Arial, sans-serif" font-size="13" fill="#9da5b4">Terminal</text>
<g style="white-space:pre" font-family="SFMono-Regular, Menlo, Consolas, Liberation Mono, monospace" font-size="14" xml:space="preserve">
<text x="22" y="56"><tspan fill="#98c379">$ </tspan><tspan fill="#d4d4d4">python3 auto_mouse_mover.py --setup</tspan></text>
<text x="22" y="78"><tspan fill="#d4d4d4"></tspan></text>
<text x="22" y="100"><tspan fill="#98c379">=== Setup ===</tspan></text>
<text x="22" y="122"><tspan fill="#7f848e">Each day, the program starts at a random time between the earliest and latest</tspan></text>
<text x="22" y="144"><tspan fill="#7f848e">start time, and stops at a random time between the earliest and latest stop time.</tspan></text>
<text x="22" y="166"><tspan fill="#7f848e">Press Enter to keep the value shown in [brackets].</tspan></text>
<text x="22" y="188"><tspan fill="#d4d4d4"></tspan></text>
<text x="22" y="210"><tspan fill="#d4d4d4">Earliest start time (HH:MM) </tspan><tspan fill="#7f848e">[08:30]: </tspan><tspan fill="#e5c07b">08:30</tspan></text>
<text x="22" y="232"><tspan fill="#d4d4d4">Latest start time   (HH:MM) </tspan><tspan fill="#7f848e">[08:40]: </tspan><tspan fill="#e5c07b">08:45</tspan></text>
<text x="22" y="254"><tspan fill="#d4d4d4">Earliest stop time  (HH:MM) </tspan><tspan fill="#7f848e">[16:20]: </tspan><tspan fill="#e5c07b">17:00</tspan></text>
<text x="22" y="276"><tspan fill="#d4d4d4">Latest stop time    (HH:MM) </tspan><tspan fill="#7f848e">[16:40]: </tspan><tspan fill="#e5c07b">17:15</tspan></text>
<text x="22" y="298"><tspan fill="#d4d4d4">Workdays (e.g. Mon,Tue,Wed,Thu,Fri) </tspan><tspan fill="#7f848e">[Mon,Tue,Wed,Thu,Fri]: </tspan><tspan fill="#e5c07b"></tspan></text>
<text x="22" y="320"><tspan fill="#d4d4d4">Open and quit Microsoft Teams automatically? (y/n) </tspan><tspan fill="#7f848e">[y]: </tspan><tspan fill="#e5c07b"></tspan></text>
<text x="22" y="342"><tspan fill="#d4d4d4"></tspan></text>
<text x="22" y="364"><tspan fill="#98c379">Saved to /Users/you/auto-mouse-mover/config.json</tspan></text>
<text x="22" y="386"><tspan fill="#7f848e">To change these later, run this program with --setup.</tspan></text>
<text x="22" y="408"><tspan fill="#d4d4d4"></tspan></text>
<text x="22" y="430"><tspan fill="#98c379">=== auto-mouse-mover started ===</tspan></text>
<text x="22" y="452"><tspan fill="#d4d4d4">Today&#x27;s schedule: start 08:40 / stop 17:04</tspan></text>
<text x="22" y="474"><tspan fill="#d4d4d4">To stop, press Ctrl+C or close this window</tspan></text>
<text x="22" y="496"><tspan fill="#d4d4d4"></tspan></text>
<text x="22" y="518"><tspan fill="#56b6c2">Next work period: Mon 11/16 08:40 (waiting quietly until then)</tspan></text>
<text x="22" y="540"><tspan fill="#d4d4d4"></tspan></text>
<text x="22" y="562"><tspan fill="#7f848e">[08:40]</tspan><tspan fill="#98c379"> &gt; Work period started</tspan></text>
<text x="22" y="584"><tspan fill="#61afef">[Teams]</tspan><tspan fill="#d4d4d4"> Opening Microsoft Teams...</tspan></text>
<text x="22" y="606"><tspan fill="#7f848e">[08:40:05]</tspan><tspan fill="#d4d4d4"> Mouse moved</tspan></text>
<text x="22" y="628"><tspan fill="#7f848e">[08:41:05]</tspan><tspan fill="#d4d4d4"> Mouse moved</tspan></text>
<text x="22" y="650"><tspan fill="#7f848e">[08:42:05]</tspan><tspan fill="#d4d4d4"> Mouse moved</tspan></text>
<text x="22" y="672"><tspan fill="#7f848e">^C</tspan></text>
<text x="22" y="694"><tspan fill="#d4d4d4"></tspan></text>
<text x="22" y="716"><tspan fill="#e5c07b">[Stopped] Stopped by user.</tspan></text>
<text x="22" y="738"><tspan fill="#61afef">[Teams]</tspan><tspan fill="#d4d4d4"> Quitting Microsoft Teams...</tspan></text>
</g>
</svg>